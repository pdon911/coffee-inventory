services:
  # Frontend Service (React)
  - type: web
    name: coffee-inventory
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # CORRECTION 1: Use 'routes', not 'rewrites'
    routes:
      # Use the absolute public URL of the backend to ensure reliable connection 
      # and automatic spin-up on the free tier.
      - type: rewrite
        source: /api/*
        destination: https://backend-i2ms.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend Service (Python)
  - type: web
    name: backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
